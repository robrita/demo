[project]
name = "test-case-generator"
version = "0.1.0"
description = "Sample Python test generator using GitHub Copilot or Microsoft Foundry models."
requires-python = ">=3.8"
dependencies = [
    "github-copilot-sdk",
    "pytest",
    "python-dotenv",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]